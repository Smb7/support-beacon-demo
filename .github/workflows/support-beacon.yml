name: Support Beacon issues

on:
  repository_dispatch:
    types: [support-beacon]

permissions:
  issues: write
  contents: read

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: Smb7/support-beacon@feat/create-issue-payload
        with:
          mode: create-issue
          labels: support
          title-prefix: "[Support]"
